<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <!-- =========================================
        METADADOS ESSENCIAIS
     ========================================= */ -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R-Next | Arquitetura de Sistemas & Soluções Digitais</title>
  <meta name="description" content="Desenvolvimento de software de alta performance, landing pages estáticas, sistemas sob medida (SaaS, PWA) e automações com infraestrutura ágil. Soluções que codam o futuro do seu negócio.">
  <meta name="author" content="Rodrigo Souza | R-Next">
  <meta name="robots" content="index, follow">

  <!-- Meta Tags Open Graph (Social Sharing) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="R-Next | Arquitetura de Sistemas & Soluções Digitais">
  <meta property="og:description" content="Soluções estáticas e sistemas sob medida orientados a performance, inovação e escala.">
  <meta property="og:site_name" content="R-Next">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="R-Next | Soluções Digitais">
  <meta name="twitter:description" content="Soluções que codam o FUTURO.">

  <!-- =========================================
        RECURSOS EXTERNOS (Fonts & AlpineJS)
     ========================================= */ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Alpine.js CDN (Gerenciamento leve de estado) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- =========================================
        ESTILOS (Ordem estrita de cascata)
     ========================================= */ -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">

  <!-- =========================================
        SCRIPTS DA APLICAÇÃO
     ========================================= */ -->
  <script defer src="assets/js/security.js"></script>
  <script defer src="assets/js/background.js"></script>
  <script defer src="assets/js/main.js"></script>
</head>
<body x-data="{ mobileMenuOpen: false }">

  <!-- Canvas animado de fundo (Rede de partículas) -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- =========================================
        CABEÇALHO / NAVEGAÇÃO
     ========================================= */ -->
  <header id="main-header">
    <nav id="navbar" aria-label="Navegação principal">
      <!-- Logo R-Next -->
      <a href="#home" class="nav-logo" id="nav-logo-link">
        <span class="logo-text">R-NEXT<span class="logo-dot">.</span></span>
      </a>

      <!-- Links de navegação desktop -->
      <ul class="nav-links" id="nav-desktop-menu">
        <li><a href="#home" class="nav-link">Home</a></li>
        <li><a href="#sobre" class="nav-link">Sobre</a></li>
        <li><a href="#servicos" class="nav-link">Serviços</a></li>
        <li><a href="#diferenciais" class="nav-link">Diferenciais</a></li>
      </ul>

      <!-- CTA de Contato -->
      <div class="nav-actions">
        <a href="#contato" class="btn btn-primary" id="header-cta-btn">Fale Conosco</a>
      </div>

      <!-- Botão de Toggle do Menu Mobile -->
      <button 
        type="button" 
        class="mobile-menu-btn" 
        id="mobile-menu-toggle-btn"
        @click="mobileMenuOpen = !mobileMenuOpen"
        :aria-expanded="mobileMenuOpen"
        aria-label="Alternar menu de navegação"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-show="!mobileMenuOpen">
          <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-show="mobileMenuOpen" style="display: none;">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </nav>

    <!-- Menu Mobile Dropdown (Alpine.JS) -->
    <div 
      class="mobile-menu" 
      id="mobile-menu-drawer"
      x-show="mobileMenuOpen" 
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 -translate-y-2"
      x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100 translate-y-0"
      x-transition:leave-end="opacity-0 -translate-y-2"
      @click.outside="mobileMenuOpen = false"
      style="display: none;"
    >
      <a href="#home" class="nav-link" @click="mobileMenuOpen = false">Home</a>
      <a href="#sobre" class="nav-link" @click="mobileMenuOpen = false">Sobre</a>
      <a href="#servicos" class="nav-link" @click="mobileMenuOpen = false">Serviços</a>
      <a href="#diferenciais" class="nav-link" @click="mobileMenuOpen = false">Diferenciais</a>
      <a href="#contato" class="btn btn-primary" @click="mobileMenuOpen = false" style="margin-top: 0.5rem;">Fale Conosco</a>
    </div>
  </header>

  <!-- =========================================
        CONTEÚDO PRINCIPAL (Main)
     ========================================= */ -->
  <main id="main-content">
    
    <!-- 1. Hero Section -->
    <section id="home" class="section hero-section" aria-labelledby="hero-title">
      <div class="container">
        <!-- Conteúdo será construído na Etapa 6 -->
      </div>
    </section>

    <!-- 2. Pain / Context Section (Sobre) -->
    <section id="sobre" class="section sobre-section" aria-labelledby="sobre-title">
      <div class="container">
        <!-- Conteúdo será construído na Etapa 6 -->
      </div>
    </section>

    <!-- 3. Services Section -->
    <section id="servicos" class="section servicos-section" aria-labelledby="servicos-title">
      <div class="container">
        <!-- Conteúdo será construído na Etapa 6 -->
      </div>
    </section>

    <!-- 4. Diferenciais Section -->
    <section id="diferenciais" class="section diferenciais-section" aria-labelledby="diferenciais-title">
      <div class="container">
        <!-- Conteúdo será construído na Etapa 6 -->
      </div>
    </section>

    <!-- 5. Contact Section -->
    <section id="contato" class="section contato-section" aria-labelledby="contato-title">
      <div class="container">
        <!-- Conteúdo será construído na Etapa 6 -->
      </div>
    </section>

  </main>

  <!-- =========================================
        RODAPÉ (Footer)
     ========================================= */ -->
  <footer id="main-footer">
    <div class="container">
      <!-- Conteúdo será construído na Etapa 6 -->
    </div>
  </footer>

</body>
</html>
